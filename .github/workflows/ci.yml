name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Codegen drift check
        run: |
          pnpm gen:api
          if ! git diff --quiet -- src/lib/volvo/*.gen.ts; then
            echo "::error::Generated Volvo clients are out of date. Run 'pnpm gen:api' and commit."
            git diff -- src/lib/volvo/*.gen.ts
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Tests
        # Call vitest directly: `pnpm test --run` would route `--run` to pnpm.
        # --passWithNoTests so the suite doesn't error before we add tests.
        run: pnpm exec vitest run --passWithNoTests
