name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Force JS-actions onto Node 24 ahead of GitHub flipping the default on
# 2026-06-02; silences the Node 20 deprecation warning today.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version is read from the `packageManager` field in package.json
      # (currently pinned to pnpm@11.3.0).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Codegen drift check
        run: |
          pnpm gen:api
          if ! git diff --quiet -- src/lib/volvo/*.gen.ts; then
            echo "::error::Generated Volvo clients are out of date. Run 'pnpm gen:api' and commit."
            git diff -- src/lib/volvo/*.gen.ts
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Tests
        # Call vitest directly: `pnpm test --run` would route `--run` to pnpm.
        # --passWithNoTests so the suite doesn't error before we add tests.
        run: pnpm exec vitest run --passWithNoTests
