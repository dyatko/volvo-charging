name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Workload Identity Federation needs id-token write.
permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
  GCP_REGION: europe-north1
  GCP_AR_REPO: volvo-charging
  GCP_SERVICE: volvo-charging
  GCP_SQL_INSTANCE: volvo-db
  GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}   # full resource name
  GCP_DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}     # deployer@PROJECT.iam.gserviceaccount.com

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          if [ -n "${{ vars.GCP_PROJECT_ID }}" ] && [ -n "${{ vars.GCP_WIF_PROVIDER }}" ] && [ -n "${{ vars.GCP_DEPLOYER_SA }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy — GCP repository variables not configured yet. See README → 'Deploying to Google Cloud Run'."
          fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_AR_REPO }}/app:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          # Also tag the latest commit on main so prod-revert is one tag flip.
          docker tag "$IMAGE" "${IMAGE%:*}:latest"
          docker push "${IMAGE%:*}:latest"

      - name: Run database migrations
        # Cloud SQL doesn't accept connections from the open internet, so the
        # GHA runner spawns cloud-sql-proxy as a sidecar (auth via the same
        # WIF token already loaded above — deployer SA has roles/cloudsql.client).
        # drizzle then connects to the proxy on localhost.
        run: |
          curl -fsSL -o cloud-sql-proxy \
            https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.3/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port=5432 \
            "${{ env.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:${{ env.GCP_SQL_INSTANCE }}" &
          PROXY_PID=$!
          # Wait for the proxy to start listening (max 30s)
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/5432) 2>/dev/null && break
            sleep 1
          done
          DB_PASSWORD=$(gcloud secrets versions access latest \
            --secret=DB_PASSWORD --project=${{ env.GCP_PROJECT_ID }})
          echo "::add-mask::$DB_PASSWORD"
          export DATABASE_URL="postgresql://volvo:${DB_PASSWORD}@127.0.0.1:5432/volvo?sslmode=disable"
          pnpm db:migrate
          kill "$PROXY_PID" || true

      - name: Deploy to Cloud Run
        id: deploy
        env:
          IMAGE: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_AR_REPO }}/app:${{ github.sha }}
        run: |
          # Single-shot deploy: Cloud Run does atomic revision swaps — if the
          # new revision fails to become Ready, the previous one keeps serving
          # and `gcloud run deploy` exits non-zero. Rollback is a one-line
          # `update-traffic --to-revisions=<prev>=100` away if we ever need it.
          gcloud run deploy ${{ env.GCP_SERVICE }} \
            --image="$IMAGE" \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=8080 \
            --memory=512Mi \
            --cpu=1 \
            --cpu-boost \
            --concurrency=80 \
            --timeout=300 \
            --min-instances=0 \
            --max-instances=2 \
            --service-account="cloud-run-app@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --add-cloudsql-instances="${{ env.GCP_PROJECT_ID }}:${{ env.GCP_REGION }}:${{ env.GCP_SQL_INSTANCE }}" \
            --update-secrets="DATABASE_URL=DATABASE_URL:latest,SESSION_SECRET=SESSION_SECRET:latest,DATA_ENCRYPTION_KEK=DATA_ENCRYPTION_KEK:latest" \
            --update-env-vars="INTERNAL_CALLER_EMAIL=scheduler@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --quiet
          SERVICE_URL=$(gcloud run services describe ${{ env.GCP_SERVICE }} \
            --region=${{ env.GCP_REGION }} --format='value(status.url)')
          echo "service_url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          set -e
          URL="${{ steps.deploy.outputs.service_url }}"
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 10 "$URL/api/healthz"; then
              echo "✓ /api/healthz live at $URL"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Smoke test failed against $URL"
          exit 1
